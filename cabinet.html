  <script>
    // 造物拾遗轮播功能
    (function() {
      const carousel = document.getElementById('cabinet-carousel');
      if (!carousel) return;
      
      const items = carousel.querySelectorAll('.carousel-item');
      const navTop = document.querySelector('.carousel-nav-top');
      const navBottom = document.querySelector('.carousel-nav-bottom');
      
      if (items.length === 0) return;
      
      let currentIndex = 0;
      let isTransitioning = false;
      let hoverTimeout = null;
      
      // 初始化：显示第一个项目
      function initCarousel() {
        items.forEach((item, index) => {
          item.classList.remove('active', 'prev', 'next');
          if (index === currentIndex) {
            item.classList.add('active');
          }
        });
      }
      
      // 更新轮播显示
      function updateCarousel() {
        if (isTransitioning) return;
        isTransitioning = true;
        
        items.forEach((item, index) => {
          item.classList.remove('active', 'prev', 'next');
        });
        
        // 设置当前项
        if (items[currentIndex]) {
          items[currentIndex].classList.add('active');
        }
        
        // 设置前一项（如果有）
        const prevIndex = currentIndex > 0 ? currentIndex - 1 : items.length - 1;
        if (items[prevIndex]) {
          items[prevIndex].classList.add('prev');
        }
        
        // 设置后一项（如果有）
        const nextIndex = currentIndex < items.length - 1 ? currentIndex + 1 : 0;
        if (items[nextIndex]) {
          items[nextIndex].classList.add('next');
        }
        
        setTimeout(() => {
          isTransitioning = false;
        }, 300);
      }
      
      // 切换到下一个
      function nextItem() {
        currentIndex = (currentIndex + 1) % items.length;
        updateCarousel();
      }
      
      // 切换到上一个
      function prevItem() {
        currentIndex = currentIndex > 0 ? currentIndex - 1 : items.length - 1;
        updateCarousel();
      }
      
      // 导航区域hover事件
      function setupNavHover(navElement, direction) {
        let hoverActive = false;
        
        navElement.addEventListener('mouseenter', () => {
          hoverActive = true;
          if (hoverTimeout) clearTimeout(hoverTimeout);
          
          const switchItem = () => {
            if (hoverActive && !isTransitioning) {
              if (direction === 'next') {
                nextItem();
              } else {
                prevItem();
              }
              hoverTimeout = setTimeout(switchItem, 800); // 每800ms切换一次
            }
          };
          
          // 延迟一下再开始切换，给用户一点反应时间
          hoverTimeout = setTimeout(switchItem, 300);
        });
        
        navElement.addEventListener('mouseleave', () => {
          hoverActive = false;
          if (hoverTimeout) {
            clearTimeout(hoverTimeout);
            hoverTimeout = null;
          }
        });
      }
      
      // 点击卡片跳转到详情页
      items.forEach((item) => {
        const link = item.querySelector('.card-link');
        if (link) {
          item.addEventListener('click', (e) => {
            // 如果点击的不是链接本身，则跳转
            if (e.target !== link && !link.contains(e.target)) {
              const href = item.getAttribute('data-href');
              if (href) {
                window.location.href = href;
              }
            }
          });
          
          // 添加hover效果，让卡片看起来可点击
          item.style.cursor = 'pointer';
        }
      });
      
      // 设置导航区域
      if (navTop) {
        setupNavHover(navTop, 'prev');
      }
      
      if (navBottom) {
        setupNavHover(navBottom, 'next');
      }
      
      // 初始化
      initCarousel();
      updateCarousel();
      
      // 键盘支持（可选）
      document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowDown') {
          e.preventDefault();
          nextItem();
        } else if (e.key === 'ArrowUp') {
          e.preventDefault();
          prevItem();
        }
      });
    })();
  </script>
</body>
